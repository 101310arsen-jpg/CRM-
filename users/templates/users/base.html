<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Студенты{% endblock %}</title>
  <style>
    body { font-family: sans-serif; max-width: 1000px; margin: 20px auto; padding: 0 10px; }
    table { border-collapse: collapse; width: 100%; }
    td, th { border: 1px solid #ccc; padding: 6px; text-align: left; }
    .btn { display: inline-block; padding: 5px 10px; background: #2563eb; color: #fff;
           text-decoration: none; border: 0; border-radius: 4px; cursor: pointer; }
    .danger { background: #dc2626; }
  </style>
</head>
<body>
  <p>
    {% if user.is_authenticated %}
      {{ user.username }} | <a href="{% url 'admin:logout' %}">Выйти</a>
    {% else %}
      <a href="{% url 'admin:login' %}?next={{ request.path }}">Войти</a>
    {% endif %}
  </p>
  {% block content %}{% endblock %}
</body>
</html>
