{% extends 'users/base.html' %}

{% block content %}
<h1>{% if object %}Редактирование{% else %}Новый студент{% endif %}</h1>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn">Сохранить</button>
  <a href="{% url 'users:list' %}">Отмена</a>
</form>
{% endblock %}
